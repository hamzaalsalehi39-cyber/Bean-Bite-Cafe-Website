<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bean & Bite | تسجيل الدخول</title>

    <link rel="stylesheet"
          href="css/bootstrap.rtl.min.css">

    <link rel="stylesheet"
          href="css/vendor/fontawesome-local.css">

    <link rel="stylesheet" href="css/vendor/toastify.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/vendor/modal-theme.css">

    <script src="js/jquery.min.js" defer></script>
    <script src="js/vendor/toastify.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/validation.js" defer></script>
</head>

<body>

<header>
    <nav class="navbar navbar-dark cafe-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fa fa-coffee"></i>
                Bean & Bite
            </a>
        </div>
    </nav>
</header>

<main class="container form-container">

    <div class="form-card">

        <h1>تسجيل الدخول</h1>

        <form id="loginForm" novalidate>

            <div class="mb-3">
                <label for="loginEmail">البريد الإلكتروني</label>

                <input type="email"
                       id="loginEmail"
                       class="form-control"
                       required>

                <div class="invalid-feedback">
                    أدخل بريدًا إلكترونيًا صحيحًا.
                </div>
            </div>

            <div class="mb-3">
                <label for="loginPassword">كلمة المرور</label>

                <input type="password"
                       id="loginPassword"
                       class="form-control"
                       required
                       minlength="8">

                <div class="invalid-feedback">
                    أدخل كلمة المرور.
                </div>
            </div>

            <button type="submit" class="btn main-btn w-100">
                تسجيل الدخول
            </button>

        </form>

        <p class="form-footer">
            ليس لديك حساب؟
            <a href="register.html">إنشاء حساب</a>
        </p>

    </div>

</main>

<div id="toastBox"></div>



</body>
</html>
